<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    <Directory "${APACHE_DOCUMENT_ROOT}">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Protección de archivos sensibles
        <FilesMatch "\.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|^(\..*|Entries.*|Repository|Root|Tag|Template|composer\.(json|lock))$|^#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)$">
            Require all denied
        </FilesMatch>
        
        <Files ".ht*">
            Require all denied
        </Files>
    </Directory>
    
    <Directory "${APACHE_DOCUMENT_ROOT}/sites/default/files">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        SetHandler default-handler
    </Directory>
    
    DirectoryIndex index.php index.html
    
    # Timeout para archivos grandes
    TimeOut 300
</VirtualHost>