              El Programa Colombia Nos Une de la Dirección de Asuntos Migratorios, Consulares y Servicio al Ciudadano, apoya la cohesión de la comunidad colombiana en el exterior por lo que brinda este espacio para que los colombianos alrededor del mundo puedan publicar, y compartir con más colombianos, sus diferentes actividades de integración, así como su participación en diferentes escenarios académicos, deportivos, culturales, etc o los realizados por otras entidades que sean de interés o utilidad para nuestra comunidad en el mundo.</p>
              <br>
              <p style="left:1%; position:relative;font-family:arial;font-size:12px; text-align: justify;">
