          content:
            value: |-
              <p class="contasociaciones" style="font-family:arial;font-size:12px;text-align: justify;">A través de este directorio el Programa Colombia Nos Une quiere reconocer y apoyar la labor de  las asociaciones  de colombianos en el exterior,  en cuanto a su identificación y  difusión de sus actividades y eventos, Así mismo busca brindar una herramienta útil de consulta para toda la comunidad migrante. El Programa Colombia Nos Une no tiene ninguna injerencia o responsabilidad en cuanto a la información de las asociaciones, o en la organización y desarrollo de actividades adelantadas por estos grupos.</p>
              </br>
