global-styling:
  css:
    theme:
      css/colors.css: {}
      css/normalize.css: {}
      css/style.css: {}
      # https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css: { type: external, minified: true }
  js:
    js/global.js: {}
    https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js: { type: external, minified: true }
  dependencies:
    - core/jquery
    - core/drupal
    - core/once
    - colombianosune_d11/bootstrap-icons
    - colombianosune_d11/custom-fonts


# Biblioteca para componentes personalizados
components:
  css:
    theme:
      css/components/header.css: {}
      css/components/navigation.css: {}
      css/components/footer.css: {}
      css/components/cards.css: {}
  js:
    js/components/navigation.js: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/once

bootstrap-icons:
  css:
    theme:
      'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css': { type: external, minified: true }

custom-fonts:
  css:
    theme:
      'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap': { type: external, minified: true }
